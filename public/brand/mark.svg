<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!--
  The TrenchLine mark.

  Original work, drawn from primitives, and deliberately not derived from any
  Trench Crusade artwork. The icons this app shipped before were built from the
  game's own badge, which is Factory Fortress Inc.'s: their copyright in the
  art, and their trademark as an identity. An unofficial companion using the
  publisher's logo as its own masthead reads as endorsement whatever the
  footer says.

  Two shapes, both plain geometry:

    the cross    the setting's war is a religious one
    the trench   a fire trench in plan view is CRENELLATED — bays, then
                 traverses, so a shell or an enfilade cannot take the length
                 of it. That zigzag is what the app is named after, and it is
                 a historical form rather than anyone's device.

  Authored as vector, so it stays sharp at 48px and can be re-coloured or
  replaced without a raster editor. Everything in `public/icons/` and
  `public/logo.*` is derived from this one file by
  `scripts/build-app-icons.mjs` — a placeholder to be swapped for real art by
  editing this and re-running that.

  No ground here on purpose. The icon builder puts the mark on its own
  full-bleed gradient and the masthead wants it transparent, so a background
  baked in at this level would have to be undone at both.

  The comment lives INSIDE the root element: sharp sniffs the format from the
  first bytes of the file, and anything before `<svg` makes it refuse to read
  what is a perfectly valid document.
-->
  <g fill="none" stroke="#D4AF37" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M256 151 V301"/>
    <path d="M200 206 H312"/>
    <!--
      Five spans, alternating, so the line starts and ends on the same level
      and mirrors about the centre. An odd count leaves it lopsided, which
      reads as a mistake at 48px rather than as a trench.
    -->
    <path d="M96 341 H160 V389 H224 V341 H288 V389 H352 V341 H416"/>
  </g>
</svg>
