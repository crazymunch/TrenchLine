<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 120" width="476" height="120">
  <!--
    Generated by scripts/build-brand-banner.mjs. Edit that, not this.

    Flat: no gradient on the ground, no plate behind the mark, no rim frame, no
    radius, no shadow, and one hairline at one weight. The mark is inlined from
    public/brand/icon.svg so there is one copy of it in the repository.
  -->
  <rect width="476" height="120" fill="#16181C"/>
  <line x1="0" y1="119.5" x2="476" y2="119.5" stroke="#2A2E36" stroke-width="1"/>

  <g transform="translate(24, 24) scale(0.140625)">
    <!--
    The TrenchLine icon. The app's own artwork, by its owner, and the single
    source for everything in `public/icons/` and `public/logo.*` — regenerate
    with `npm run icons:build`.
    
    It replaced a mark derived from the Trench Crusade badge, which was two
    problems rather than one: copyright in the artwork, and trademark, since an
    unofficial companion using the publisher's logo as its own identity reads as
    endorsement whatever a footer disclaimer says.
    
    ## It is already composed for the frame, and that is not an accident
    
    A maskable icon is cropped by the launcher to a shape nobody here chooses,
    and only the inner circle of 80% diameter is guaranteed. Measured against a
    512 canvas, where that circle has radius 204.8:
    
    disc outer edge   244.4   95.5% of the half-width — it fills the frame, so
    a circular mask crops to the disc itself rather
    than to a badge floating in a field
    gold rim          244.0   deliberately OUTSIDE the safe circle. It is a
    rim: an aggressive mask may shave it and nothing
    is lost, which is what a rim is for
    T and L letters   204.0   inside 204.8, with 0.8px to spare
    
    So nothing here is scaled or re-fitted by the build. Moving any of it inward
    to "be safe" would put a dark ring around a small badge, which is the exact
    bug this artwork was drawn to fix.
    
    `id="bn-canvas"` on the background rect is the one edit made to the delivered
    file. The build strips that element to produce the transparent variants —
    the browser-tab favicon and the in-app masthead, where a dark square inside
    dark chrome draws a box around nothing — and keeps it for the home-screen
    icons, which must be full bleed.
    -->
    <defs>
    <radialGradient id="bn-bucklerFieldOpt3" cx="50%" cy="46%" r="68%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="65%" stop-color="#ECEFF4"/>
    <stop offset="100%" stop-color="#CCD0DC"/>
    </radialGradient>
    <linearGradient id="bn-bronzeRimOpt3" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ECC66D"/>
    <stop offset="50%" stop-color="#B88F30"/>
    <stop offset="100%" stop-color="#6F4F13"/>
    </linearGradient>
    </defs>
    
    <!-- Dark background canvas -->
    
    <!-- Clean single-perimeter buckler shield disk -->
    <circle cx="256" cy="256" r="238" fill="url(#bn-bucklerFieldOpt3)" stroke="url(#bn-bronzeRimOpt3)" stroke-width="12"/>
    
    <!-- Central Crimson Cross (Single horizontal crossbeam) -->
    <g fill="#C62828">
    <!-- Vertical Spine with barbed/flared Maltese terminals -->
    <path d="M246 112 L230 84 H282 L266 112 L262 396 L280 424 H232 L250 396 L250 112 Z"/>
    <!-- Primary Horizontal Crossbeam -->
    <path d="M112 266 L84 280 V232 L112 246 L400 246 L428 232 V280 L400 266 Z"/>
    <!-- Central Reliquary Rhombus Aperture -->
    <polygon points="256,214 298,256 256,298 214,256"/>
    <polygon points="256,238 274,256 256,274 238,256" fill="url(#bn-bucklerFieldOpt3)"/>
    <circle cx="256" cy="256" r="4.5" fill="#C62828"/>
    </g>
    
    <!--
    OPTION 3: Pronounced Outward Flank with 10% Additional Reduction (Scale 0.81).
    T is placed at translate(26, 46) and L at translate(72, 46).
    This creates a prominent, generous white isolation channel (approx 20px) completely separating
    the T's crossbar, stem, and base from the red cross, and giving the central theological cross full reliquary prominence.
    -->
    <g id="bn-letters-tl-opt3" fill="#0B0C0F">
    <!-- LEFT: 'T' shifted outwards to clear cross completely -->
    <g id="bn-letter-t" transform="translate(26, 46) scale(0.81)">
    <!-- Main Crossbar & Stem (Top edge at y=114, Base at y=366) -->
    <path d="M76 114 H252 V158 H190 V348 H212 V366 H126 V348 H148 V158 H76 Z"/>
    <!-- Left chiseled drop serif -->
    <polygon points="76,114 76,172 98,158 98,136 148,136"/>
    <!-- Right chiseled drop serif -->
    <polygon points="252,114 252,172 230,158 230,136 190,136"/>
    <!-- Base slab flare serifs matching baseline y=366 -->
    <polygon points="126,366 148,342 148,348"/>
    <polygon points="212,366 190,342 190,348"/>
    </g>
    
    <!-- RIGHT: 'L' shifted outwards symmetrically -->
    <g id="bn-letter-l" transform="translate(72, 46) scale(0.81)">
    <!-- Stem and Foot -->
    <path d="M314 126 H356 V324 H418 V366 H294 V348 H314 Z"/>
    <!-- Top chisel hood serif peaking at EXACT y=114 -->
    <polygon points="314,126 294,114 356,114 356,126"/>
    <!-- Forward kicking foot finial spur (baseline y=366) -->
    <polygon points="418,324 434,304 434,366 418,366"/>
    <polygon points="356,324 370,324 356,340"/>
    </g>
    </g>
  </g>

  <text x="116" y="62" font-family="Archivo" font-weight="700"
        font-size="38" letter-spacing="4.5" fill="#C59B27">TRENCHLINE</text>
  <text x="118" y="86" font-family="IBM Plex Mono" font-weight="400"
        font-size="11" letter-spacing="2.6" fill="#7A8290">WARBAND TRACKER // CRUSADE COMPANION</text>
</svg>
