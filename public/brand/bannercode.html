<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="680" height="120">
  <defs>
    <!-- Background Header Dark Slate/Charcoal Gradient -->
    <linearGradient id="navBarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1E23"/>
      <stop offset="100%" stop-color="#121417"/>
    </linearGradient>

    <!-- Steel Plaque Fill -->
    <linearGradient id="barSteelPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#ECEFF4"/>
      <stop offset="100%" stop-color="#C2C7D4"/>
    </linearGradient>

    <!-- Burnished Gold Rim Gradient -->
    <linearGradient id="barGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C360"/>
      <stop offset="50%" stop-color="#C69E32"/>
      <stop offset="100%" stop-color="#7D5811"/>
    </linearGradient>
  </defs>

  <!-- Navigation Bar Bar Background -->
  <rect width="680" height="120" fill="url(#navBarBg)"/>
  <!-- Subtle bottom dividing hairline -->
  <line x1="0" y1="119" x2="680" y2="119" stroke="#2D323B" stroke-width="1.5"/>

  <!-- ==================== HEADER LOGO TILE (LEFT) ==================== -->
  <g transform="translate(24, 18)">
    <!-- Outer Gold Border Frame (84x84) -->
    <rect x="0" y="0" width="84" height="84" rx="2" fill="none" stroke="url(#barGoldGrad)" stroke-width="3.5"/>
    <!-- Inset Steel Plaque -->
    <rect x="3" y="3" width="78" height="78" fill="url(#barSteelPlate)"/>

    <!-- Central Crimson Cross -->
    <g fill="#C62828" transform="translate(42, 42) scale(0.18) translate(-256, -256)">
      <path d="M246 112 L230 84 H282 L266 112 L262 396 L280 424 H232 L250 396 L250 112 Z"/>
      <path d="M112 266 L84 280 V232 L112 246 L400 246 L428 232 V280 L400 266 Z"/>
      <polygon points="256,214 298,256 256,298 214,256"/>
      <polygon points="256,238 274,256 256,274 238,256" fill="url(#barSteelPlate)"/>
      <circle cx="256" cy="256" r="4.5" fill="#C62828"/>
    </g>

    <!-- Approved Calibrated TL Letterforms -->
    <g fill="#0B0C0F" transform="translate(42, 42) scale(0.1458) translate(-256, -240)">
      <!-- Letter T -->
      <path d="M76 114 H242 V158 H190 V348 H212 V366 H126 V348 H148 V158 H76 Z"/>
      <polygon points="76,114 76,172 98,158 98,136 148,136"/>
      <polygon points="242,114 242,172 220,158 220,136 190,136"/>
      <polygon points="126,366 148,342 148,348"/>
      <polygon points="212,366 190,342 190,348"/>

      <!-- Letter L -->
      <path d="M314 126 H356 V324 H418 V366 H294 V348 H314 Z"/>
      <polygon points="314,126 294,114 356,114 356,126"/>
      <polygon points="418,324 434,304 434,366 418,366"/>
      <polygon points="356,324 370,324 356,340"/>
    </g>
  </g>

  <!-- ==================== BRAND WORDMARK ==================== -->
  <text x="132" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="4.5" fill="#C59B27">TRENCHLINE</text>

  <!-- Subtle Military Sub-tag -->
  <text x="135" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#6E7686">WARBAND TRACKER // CRUSADE COMPANION</text>

  <!-- Right-side tactical badge status pip -->
  <g transform="translate(628, 52)">
    <circle cx="12" cy="8" r="5" fill="#22C55E"/>
    <circle cx="12" cy="8" r="9" fill="none" stroke="#22C55E" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
