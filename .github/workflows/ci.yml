name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By hand, when a run needs forcing. `deploy.yml` has had this from the
  # start; CI not having it was an inconsistency rather than a decision, and it
  # bit today: GitHub delivered no `pull_request` event for one PR, so the only
  # ways to get a check onto that head were an empty commit or a close-and-
  # reopen — both of which are worse than a button.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres, because the migrations and the ownership checks are the
    # two things this repository had no way to verify. `prisma db push` was
    # never safe to review or roll back, and no test imported an API route, so
    # the whole account and campaign boundary was unchecked while every other
    # gate stayed green.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenchline_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchline_ci
      NEXTAUTH_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The schema must be reachable from an EMPTY database using only what is
      # committed. Before this, `prisma/` held a schema and a seed and no
      # migration history at all, so recreating the database, reviewing a
      # change, or rolling one back were all things nobody could do.
      - name: Migrations apply from empty
        run: npx prisma migrate deploy

      # And the committed migrations must actually produce the committed
      # schema. A migration edited by hand, or a schema change someone pushed
      # with `db push` and never captured, shows up here rather than as a
      # column that only exists in production.
      - name: Schema matches its migrations
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code || {
              echo "::error::prisma/schema.prisma has drifted from prisma/migrations."
              echo "Run 'npx prisma migrate dev' and commit the generated migration."
              exit 1
            }

      - name: Typecheck
        run: npm run typecheck

      # Was ignored during builds by a flag that suppressed a linter which did
      # not exist. See next.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Verifies the dataset against the sources without writing anything.
      # Fails on an unresolved source conflict or a field with no provenance —
      # see docs/RULESET-MODEL.md §6. The BattleScribe catalogues and the
      # extracted rulebook text are committed, so this needs no network.
      - name: Verify game data
        run: npm run rules:check

      # Catches a generated file that has drifted from data-sources/, which
      # would mean someone hand-edited build output.
      - name: Generated data is up to date
        run: |
          npm run rules:build
          if ! git diff --quiet -- src/data/generated; then
            echo "::error::src/data/generated is stale. Run 'npm run rules:build' and commit the result."
            git diff --stat -- src/data/generated
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Chromium only: the E2E projects pin it, so this is one download rather
      # than three. See playwright.config.ts.
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      # Runs against the production build above — the bugs these catch are
      # production bugs (a Tailwind rule tree-shaken out of the compiled
      # stylesheet, a layout that only overflows once real data has loaded) and
      # none of them reproduce under `next dev`.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
