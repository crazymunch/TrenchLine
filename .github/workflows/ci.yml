name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By hand, when a run needs forcing. `deploy.yml` has had this from the
  # start; CI not having it was an inconsistency rather than a decision, and it
  # bit today: GitHub delivered no `pull_request` event for one PR, so the only
  # ways to get a check onto that head were an empty commit or a close-and-
  # reopen — both of which are worse than a button.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres, because the migrations and the ownership checks are the
    # two things this repository had no way to verify. `prisma db push` was
    # never safe to review or roll back, and no test imported an API route, so
    # the whole account and campaign boundary was unchecked while every other
    # gate stayed green.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenchline_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchline_ci
      # The same value: this Postgres has no pooler in front of it. The schema
      # declares `directUrl` because production runs through Neon's, and
      # `prisma migrate` fails outright when the variable is unset — so it is
      # set here rather than discovered by a red build.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchline_ci
      # The only database the integration suites may write to. Deliberately a
      # separate name from DATABASE_URL, which in a developer's environment
      # points at production — see src/lib/integrationDb.ts and docs/DATABASE.md.
      TRENCHLINE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchline_ci
      NEXTAUTH_SECRET: ci-placeholder
      # robots.txt and sitemap.xml name an absolute origin, and `siteUrl()`
      # throws rather than default to one — a sitemap full of localhost is a
      # sitemap Google believes. CI's build is not a deployment, so it gets the
      # E2E server's origin rather than the production domain.
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The schema must be reachable from an EMPTY database using only what is
      # committed. Before this, `prisma/` held a schema and a seed and no
      # migration history at all, so recreating the database, reviewing a
      # change, or rolling one back were all things nobody could do.
      - name: Migrations apply from empty
        run: npx prisma migrate deploy

      # And the committed migrations must actually produce the committed
      # schema. A migration edited by hand, or a schema change someone pushed
      # with `db push` and never captured, shows up here rather than as a
      # column that only exists in production.
      - name: Schema matches its migrations
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code || {
              echo "::error::prisma/schema.prisma has drifted from prisma/migrations."
              echo "Run 'npx prisma migrate dev' and commit the generated migration."
              exit 1
            }

      - name: Typecheck
        run: npm run typecheck

      # Was ignored during builds by a flag that suppressed a linter which did
      # not exist. See next.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Verifies the dataset against the sources without writing anything.
      # Fails on an unresolved source conflict or a field with no provenance —
      # see docs/RULESET-MODEL.md §6. The BattleScribe catalogues and the
      # extracted rulebook text are committed, so this needs no network.
      - name: Verify game data
        run: npm run rules:check

      # Catches a generated file that has drifted from data-sources/, which
      # would mean someone hand-edited build output.
      - name: Generated data is up to date
        run: |
          npm run rules:build
          if ! git diff --quiet -- src/data/generated; then
            echo "::error::src/data/generated is stale. Run 'npm run rules:build' and commit the result."
            git diff --stat -- src/data/generated
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Chromium only: the E2E projects pin it, so this is one download rather
      # than three. See playwright.config.ts.
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      # Runs against the production build above — the bugs these catch are
      # production bugs (a Tailwind rule tree-shaken out of the compiled
      # stylesheet, a layout that only overflows once real data has loaded) and
      # none of them reproduce under `next dev`.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Dependency advisories.
  #
  # A separate job, because it is the one gate whose failure mode is "the
  # scanner could not reach its data". The audit's own `npm audit --omit=dev`
  # got an HTTP 403 from the advisory endpoint and could report nothing — and
  # an outage that reads as a pass is worse than no scanner, because it looks
  # like a clean bill of health.
  #
  # So it distinguishes the two: a scanner that ran and found something fails
  # the build; a scanner that could not run says so, loudly, and does not
  # pretend.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Production dependencies only. A dev-only advisory is worth knowing
      # about and is not a reason to block a release, because it never ships.
      #
      # Both outcomes fail the job, and both used to be reported as the first
      # one. The reason was inferred from the EXIT CODE and a grep of stderr
      # for `4[0-9]{2}|ENOTFOUND|ETIMEDOUT|network`, so anything the grep did
      # not recognise — a registry 5xx, a reset connection, a truncated
      # response — was announced as "found high or critical advisories in
      # production dependencies", with the list of offending packages printed
      # empty underneath it because there were none. A check that names a
      # cause it has no evidence for sends people to look for a vulnerability
      # that is not there.
      #
      # So the finding is read from the REPORT and the failure from the exit
      # code, separately. Neither is a pass: an audit that could not be run is
      # still an audit that did not clear these dependencies.
      - name: Audit production dependencies
        run: |
          set -o pipefail

          # Up to three attempts. `npm audit` makes ONE POST to the advisory
          # endpoint and does not retry it, and that endpoint answered
          # `400 Bad Request` for a stretch on 2026-09-04 — from GitHub's
          # runners, while the identical lockfile audited clean elsewhere in
          # the same minutes. One bad answer should not fail a build, and
          # three of them is a real outage rather than a blip.
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high --json > audit.json 2> audit.err && status=0 || status=$?
            # A report naming advisories is an answer: stop and act on it.
            if [ "$status" -eq 0 ] || grep -q '"vulnerabilities"' audit.json; then break; fi
            echo "attempt $attempt: npm audit exited $status without a report; retrying"
            cat audit.err
            sleep $((attempt * 10))
          done

          # An unreadable report yields nothing rather than throwing, so the
          # exit-code branch below reports it as what it is.
          found=$(node -e "let a;try{a=require('./audit.json')}catch{process.exit(0)};for(const[k,v]of Object.entries(a.vulnerabilities??{}))if(['high','critical'].includes(v.severity))console.log(\`\${v.severity}: \${k} — \${(v.via??[]).map(x=>x.title??x).join(', ')}\`)")

          if [ -n "$found" ]; then
            echo "::error::npm audit found high or critical advisories in production dependencies."
            echo "$found"
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::npm audit exited $status and reported no high or critical advisory — the advisory endpoint could not be reached, or its answer could not be read. This is NOT a pass."
            cat audit.err
            exit 1
          fi

          echo "No high or critical advisories in production dependencies."

  # NOTE: `actions/dependency-review-action` is deliberately NOT here, and
  # enabling the Dependency graph is NOT enough to change that.
  #
  # It was added back once, on the strength of the repository's SBOM endpoint
  # answering 200 — which proves the graph is on, and proves nothing about
  # this action. The job failed on its first run with the same error it always
  # gave:
  #
  #   Dependency review is not supported on this repository. Please ensure
  #   that Dependency graph is enabled along with GitHub Advanced Security
  #
  # The requirement is BOTH, and on a private repository — which this is —
  # Advanced Security is a paid add-on. The graph alone buys the SBOM endpoint
  # and `npm audit`; it does not buy dependency review.
  #
  # A check that is red for a reason no pull request can fix teaches people to
  # ignore red checks, which costs more than the job is worth. The `dependencies`
  # job above already audits the production tree against the advisory database
  # and needs neither.
  #
  # To turn it on: enable GitHub Advanced Security under Settings -> Code
  # security (or make the repository public, where dependency review needs only
  # the graph), then add a job running `actions/dependency-review-action@v4`
  # with `fail-on-severity: high`, gated on `pull_request` — there is no base
  # to diff a push against and the action errors rather than skipping.
